services:
  clock-alignment:
    build: .
    image: event-clock-alignment:latest
    container_name: event-clock-alignment
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2); assert json.load(r)['status']=='ok'"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
